name: Storybook

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build Storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ui-kit-storybook exec playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: pnpm test:package
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build:storybook
      - run: pnpm test:visual
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storybook-coverage
          path: apps/storybook/coverage/
      - name: Upload visual test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storybook-visual-results
          path: |
            apps/storybook/playwright-report/
            apps/storybook/test-results/
      - name: Upload static Storybook
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storybook-static
          path: apps/storybook/storybook-static/
      - name: Publish and run Chromatic visual tests
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CHROMATIC_PROJECT_TOKEN != ''
        run: pnpm --filter ui-kit-storybook chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
