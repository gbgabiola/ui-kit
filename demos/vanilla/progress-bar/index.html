<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="style.css">
  <title>Progress Bar</title>
  <link rel="stylesheet" href="../demo.css">
</head>

<body>
  <h1>Progress bar</h1>
  <div class="container">
    <div class="progress" role="progressbar" aria-label="Demo progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-bar" data-complete="0">0%</div>
    </div>
  </div>

  <div class="btn-container">
    <button class="btn start" type="button">Start Progress</button>
    <button class="btn reset" type="reset">Reset</button>
  </div>

  <script src="app.js"></script>
<nav class="demo-navigation" aria-label="Demo navigation"><a href="../../">← All demos</a><a href="https://github.com/gbgabiola/ui-kit/tree/main/demos/vanilla/progress-bar">View source</a></nav>
</body>

</html>
