<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="style.css">
  <title>Progress Bar</title>
  <link rel="stylesheet" href="../../theme.css">
  <link rel="stylesheet" href="../../shared/demo.css">
  <script src="../../shared/appearance.js"></script>
</head>

<body>
  <h1>Progress bar</h1>
  <div class="container">
    <div class="progress" role="progressbar" aria-label="Demo progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-bar" data-complete="0" aria-hidden="true"></div><span class="progress-label" aria-hidden="true">0%</span>
    </div>
  </div>

  <div class="btn-container">
    <button class="btn start" type="button">Start Progress</button>
    <button class="btn reset" type="reset">Reset</button>
  </div>

  <script src="app.js"></script>
</body>

</html>
